<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvatarTutor - AI Learning Platform with Groups & Gamification</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        .app-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            margin: 0;
        }

        .user-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
        }

        .stat-badge {
            background: rgba(0, 212, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge .value {
            color: #00d4ff;
            font-weight: bold;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-section h3 {
            color: #00d4ff;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .nav-button {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 14px;
            width: 100%;
        }

        .nav-button:hover,
        .nav-button.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .screen {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-box h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #00d4ff;
            margin: 10px 5px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 13px;
            margin: 5px;
        }

        /* Groups */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .group-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .group-card:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-5px);
        }

        .group-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .group-members {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 10px;
        }

        /* Leaderboard */
        .leaderboard {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .leaderboard-header {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 13px;
        }

        .leaderboard-row {
            padding: 15px;
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }

        .rank {
            text-align: center;
            font-weight: bold;
            color: #00d4ff;
        }

        /* Question Screen */
        .question-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            min-height: 100%;
        }

        @media (max-width: 1200px) {
            .question-layout {
                grid-template-columns: 1fr;
            }
        }

        .avatar-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            height: fit-content;
        }

        .avatar-canvas {
            width: 100%;
            height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .avatar-speaking {
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
            min-height: 40px;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .avatar-controls {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .avatar-controls button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
        }

        .question-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
        }

        .option.selected {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .option.correct {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }

        .option.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .feedback.correct {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .feedback.incorrect {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        /* File Upload */
        .upload-area {
            border: 2px dashed rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 212, 255, 0.05);
        }

        .upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        #fileInput {
            display: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #b0b0b0;
        }

        .close-modal:hover {
            color: #00d4ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            color: #00d4ff;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #b0b0b0;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #f44336;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .header {
                flex-wrap: wrap;
            }

            .user-stats {
                width: 100%;
                margin-top: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Avatar Component with Animation
        function AvatarComponent({ emotion, isSpeaking }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Head
                ctx.fillStyle = '#fdbcb4';
                ctx.beginPath();
                ctx.arc(150, 120, 60, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                const eyeY = emotion === 'happy' ? 100 : 105;
                const eyeSize = emotion === 'happy' ? 12 : 15;
                
                // Left eye
                ctx.beginPath();
                ctx.arc(120, eyeY, eyeSize / 2, 0, Math.PI * 2);
                ctx.fill();

                // Right eye
                ctx.beginPath();
                ctx.arc(180, eyeY, eyeSize / 2, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                if (emotion === 'happy') {
                    ctx.arc(150, 150, 20, 0, Math.PI);
                    ctx.stroke();
                } else if (isSpeaking) {
                    ctx.ellipse(150, 150, 12, 18, 0, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.moveTo(135, 150);
                    ctx.lineTo(165, 150);
                    ctx.stroke();
                }

                // Animation glow if speaking
                if (isSpeaking) {
                    ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(150, 120, 70, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }, [emotion, isSpeaking]);

            return <canvas ref={canvasRef} className="avatar-canvas" width="300" height="300" />;
        }

        // Main App
        function AvatarTutorApp() {
            const [screen, setScreen] = useState('login');
            const [user, setUser] = useState(null);
            const [groups, setGroups] = useState(JSON.parse(localStorage.getItem('groups')) || []);
            const [currentGroup, setCurrentGroup] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [answered, setAnswered] = useState(false);
            const [userStats, setUserStats] = useState(JSON.parse(localStorage.getItem('userStats')) || {
                score: 0,
                attempts: 0,
                streak: 0,
                badges: [],
                level: 1
            });
            const [avatarEmotion, setAvatarEmotion] = useState('thinking');
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [avatarMessage, setAvatarMessage] = useState('Ready to learn?');
            const [showModal, setShowModal] = useState(false);
            const [modalContent, setModalContent] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // Load user from localStorage
            useEffect(() => {
                const savedUser = localStorage.getItem('currentUser');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                    setScreen('dashboard');
                }
            }, []);

            // Save stats to localStorage
            useEffect(() => {
                if (user) {
                    localStorage.setItem('userStats', JSON.stringify(userStats));
                }
            }, [userStats, user]);

            // Save groups to localStorage
            useEffect(() => {
                localStorage.setItem('groups', JSON.stringify(groups));
            }, [groups]);

            // Speak with AI Avatar
            const speakWithAvatar = async (text) => {
                setIsSpeaking(true);
                setAvatarMessage(text);
                
                try {
                    const response = await fetch('/api/speak', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const audio = new Audio(data.audio);
                        await new Promise(resolve => {
                            audio.onended = resolve;
                            audio.play().catch(err => {
                                console.log('Audio playback failed:', err);
                                resolve();
                            });
                            setTimeout(resolve, 5000);
                        });
                    }
                } catch (error) {
                    console.log('Avatar speech skipped:', error);
                }
                
                setIsSpeaking(false);
            };

            // Generate questions from content
            const generateQuestionsFromContent = async (content) => {
                setLoading(true);
                setError('');
                try {
                    const response = await fetch('/api/generatequestions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content })
                    });

                    const data = await response.json();
                    
                    if (response.ok && data.questions) {
                        return data.questions;
                    } else {
                        throw new Error(data.error || 'Failed to generate questions');
                    }
                } catch (error) {
                    setError('Error: ' + error.message);
                    console.error('Error generating questions:', error);
                    return [];
                } finally {
                    setLoading(false);
                }
            };

            // Handle file upload
            const handleFileUpload = async (file) => {
                if (file.type === 'application/pdf') {
                    setError('PDF support coming soon! Please use text files.');
                    return;
                }
                
                try {
                    const text = await file.text();
                    const qs = await generateQuestionsFromContent(text);
                    if (qs.length > 0) {
                        setQuestions(qs);
                        setCurrentQuestionIdx(0);
                        setSelectedAnswer(null);
                        setAnswered(false);
                        setShowModal(false);
                        setScreen('question');
                    }
                } catch (error) {
                    setError('Error reading file: ' + error.message);
                }
            };

            // Login
            const handleLogin = (username) => {
                const newUser = {
                    id: Date.now(),
                    username,
                    createdAt: new Date()
                };
                setUser(newUser);
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                setScreen('dashboard');
            };

            // Create Group
            const createGroup = (groupName) => {
                const newGroup = {
                    id: Date.now(),
                    name: groupName,
                    members: [user.id],
                    leaderboard: [{ userId: user.id, username: user.username, score: 0 }],
                    inviteCode: Math.random().toString(36).substr(2, 9)
                };
                setGroups([...groups, newGroup]);
                setModalContent('');
                setShowModal(false);
                speakWithAvatar(`Created new group ${groupName}! Invite your friends to compete!`);
            };

            // Answer Question
            const handleAnswerSubmit = async () => {
                const question = questions[currentQuestionIdx];
                const isCorrect = selectedAnswer === question.correct;

                if (isCorrect) {
                    setUserStats(prev => ({
                        ...prev,
                        score: prev.score + 1,
                        streak: prev.streak + 1,
                        attempts: prev.attempts + 1
                    }));
                    setAvatarEmotion('happy');
                    speakWithAvatar('Excellent! You got it right! ' + question.explanation);
                } else {
                    setUserStats(prev => ({
                        ...prev,
                        streak: 0,
                        attempts: prev.attempts + 1
                    }));
                    setAvatarEmotion('thinking');
                    speakWithAvatar('Not quite. ' + question.explanation);
                }

                setAnswered(true);
            };

            // Next Question
            const handleNextQuestion = () => {
                if (currentQuestionIdx < questions.length - 1) {
                    setCurrentQuestionIdx(currentQuestionIdx + 1);
                    setSelectedAnswer(null);
                    setAnswered(false);
                } else {
                    setScreen('dashboard');
                }
            };

            // Render Screens
            if (screen === 'login') {
                return <LoginScreen onLogin={handleLogin} />;
            }

            if (screen === 'dashboard') {
                return (
                    <DashboardScreen
                        user={user}
                        userStats={userStats}
                        groups={groups}
                        onCreateGroup={() => { setModalContent('createGroup'); setShowModal(true); }}
                        onSelectGroup={(g) => { setCurrentGroup(g); setScreen('group-detail'); }}
                        onStartPractice={() => { setModalContent('uploadContent'); setShowModal(true); }}
                        onLogout={() => { setUser(null); localStorage.removeItem('currentUser'); setScreen('login'); }}
                    />
                );
            }

            if (screen === 'group-detail' && currentGroup) {
                return (
                    <GroupDetailScreen
                        group={currentGroup}
                        onBack={() => setScreen('dashboard')}
                        onStartPractice={() => { setModalContent('uploadContent'); setShowModal(true); }}
                    />
                );
            }

            if (screen === 'question' && questions.length > 0) {
                const currentQuestion = questions[currentQuestionIdx];
                const progress = ((currentQuestionIdx + 1) / questions.length) * 100;

                return (
                    <div className="app-container">
                        <div className="header">
                            <h1>🎓 AvatarTutor</h1>
                            <div className="user-stats">
                                <div className="stat-badge">
                                    Score: <span className="value">{userStats.score}</span>
                                </div>
                                <div className="stat-badge">
                                    Streak: <span className="value">{userStats.streak}</span>
                                </div>
                                <div className="stat-badge">
                                    Level: <span className="value">{userStats.level}</span>
                                </div>
                            </div>
                        </div>

                        <div className="content">
                            <div className="main-content">
                                <div className="question-layout">
                                    <div className="avatar-panel">
                                        <AvatarComponent emotion={avatarEmotion} isSpeaking={isSpeaking} />
                                        <div className="avatar-speaking">{avatarMessage}</div>
                                        <div className="avatar-controls">
                                            <button className="btn-secondary btn-small" onClick={() => speakWithAvatar(avatarMessage)} disabled={isSpeaking}>
                                                🔊 Repeat
                                            </button>
                                            <button className="btn-secondary btn-small" onClick={() => setScreen('dashboard')}>
                                                ← Back
                                            </button>
                                        </div>
                                    </div>

                                    <div className="question-panel">
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{ width: `${progress}%` }}></div>
                                        </div>

                                        <h2>Question {currentQuestionIdx + 1} of {questions.length}</h2>
                                        <div className="question-text">{currentQuestion.question}</div>

                                        <div className="options">
                                            {currentQuestion.options.map((option, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`option ${selectedAnswer === idx ? 'selected' : ''} ${
                                                        answered && idx === currentQuestion.correct ? 'correct' : ''
                                                    } ${answered && selectedAnswer === idx && idx !== currentQuestion.correct ? 'incorrect' : ''}`}
                                                    onClick={() => !answered && setSelectedAnswer(idx)}
                                                >
                                                    {String.fromCharCode(65 + idx)}) {option}
                                                </div>
                                            ))}
                                        </div>

                                        {answered && (
                                            <div className={`feedback ${selectedAnswer === currentQuestion.correct ? 'correct' : 'incorrect'}`}>
                                                <strong>Explanation:</strong> {currentQuestion.explanation}
                                            </div>
                                        )}

                                        {!answered ? (
                                            <button className="btn-primary" onClick={handleAnswerSubmit} disabled={selectedAnswer === null} style={{marginTop: '20px'}}>
                                                Submit Answer
                                            </button>
                                        ) : (
                                            <button className="btn-primary" onClick={handleNextQuestion} style={{marginTop: '20px'}}>
                                                {currentQuestionIdx === questions.length - 1 ? 'Finish' : 'Next Question'}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Modal
            if (showModal && modalContent === 'createGroup') {
                return (
                    <>
                        <DashboardScreen user={user} userStats={userStats} groups={groups} onCreateGroup={() => {}} onSelectGroup={() => {}} onStartPractice={() => {}} onLogout={() => {}} />
                        <div className="modal">
                            <div className="modal-content">
                                <span className="close-modal" onClick={() => setShowModal(false)}>&times;</span>
                                <h2>Create Study Group</h2>
                                <div className="form-group">
                                    <label>Group Name</label>
                                    <input type="text" id="groupNameInput" placeholder="e.g., GMAT Prep 2024" />
                                </div>
                                <button className="btn-primary" onClick={() => {
                                    const name = document.getElementById('groupNameInput').value;
                                    if (name) createGroup(name);
                                }}>Create Group</button>
                            </div>
                        </div>
                    </>
                );
            }

            if (showModal && modalContent === 'uploadContent') {
                return (
                    <>
                        <DashboardScreen user={user} userStats={userStats} groups={groups} onCreateGroup={() => {}} onSelectGroup={() => {}} onStartPractice={() => {}} onLogout={() => {}} />
                        <div className="modal">
                            <div className="modal-content">
                                <span className="close-modal" onClick={() => setShowModal(false)}>&times;</span>
                                <h2>Upload Study Material</h2>
                                {error && <div className="error-message">{error}</div>}
                                <div className="upload-area" onClick={() => document.getElementById('fileInput').click()}>
                                    <div style={{fontSize: '30px', marginBottom: '10px'}}>📄</div>
                                    <p>Drag & Drop or Click to Upload</p>
                                    <p style={{fontSize: '12px', color: '#b0b0b0'}}>Text files - We'll generate questions automatically!</p>
                                </div>
                                <input id="fileInput" type="file" accept=".txt" onChange={(e) => {
                                    if (e.target.files[0]) {
                                        handleFileUpload(e.target.files[0]);
                                    }
                                }} />
                                <p style={{marginTop: '20px', fontSize: '14px', color: '#b0b0b0'}}>Or paste content below:</p>
                                <textarea id="contentInput" style={{width: '100%', height: '150px', marginTop: '10px'}}></textarea>
                                <button className="btn-primary" onClick={async () => {
                                    const content = document.getElementById('contentInput').value;
                                    if (content) {
                                        const qs = await generateQuestionsFromContent(content);
                                        if (qs.length > 0) {
                                            setQuestions(qs);
                                            setCurrentQuestionIdx(0);
                                            setShowModal(false);
                                            setScreen('question');
                                        }
                                    }
                                }} disabled={loading} style={{marginTop: '10px'}}>
                                    {loading ? 'Generating...' : 'Generate Questions'}
                                </button>
                            </div>
                        </div>
                    </>
                );
            }

            return null;
        }

        // Login Screen Component
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');

            return (
                <div className="app-container">
                    <div className="content">
                        <div className="login-screen">
                            <div className="login-box">
                                <h2>Welcome to AvatarTutor</h2>
                                <p style={{marginBottom: '30px', color: '#b0b0b0'}}>AI-Powered Learning with Voice, Groups & Gamification</p>
                                <div className="form-group">
                                    <label>Your Name</label>
                                    <input
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="Enter your name"
                                        onKeyPress={(e) => e.key === 'Enter' && username && onLogin(username)}
                                    />
                                </div>
                                <button className="btn-primary" onClick={() => username && onLogin(username)}>
                                    Get Started 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Dashboard Screen Component
        function DashboardScreen({ user, userStats, groups, onCreateGroup, onSelectGroup, onStartPractice, onLogout }) {
            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🎓 AvatarTutor - Dashboard</h1>
                        <div className="user-stats">
                            <div className="stat-badge">👤 {user.username}</div>
                            <div className="stat-badge">Score: <span className="value">{userStats.score}</span></div>
                            <div className="stat-badge">🔥 Streak: <span className="value">{userStats.streak}</span></div>
                            <div className="stat-badge">⭐ Level: <span className="value">{userStats.level}</span></div>
                            <button className="btn-secondary btn-small" onClick={onLogout}>Logout</button>
                        </div>
                    </div>

                    <div className="content">
                        <div className="sidebar">
                            <div className="nav-section">
                                <h3>Menu</h3>
                                <button className="nav-button active">Dashboard</button>
                                <button className="nav-button" onClick={onStartPractice}>📚 Practice</button>
                                <button className="nav-button" onClick={onCreateGroup}>👥 New Group</button>
                            </div>
                        </div>

                        <div className="main-content">
                            <h2 style={{marginBottom: '20px'}}>Welcome, {user.username}! 👋</h2>

                            <h3 style={{color: '#00d4ff', marginTop: '30px'}}>Your Stats</h3>
                            <div className="stats-grid">
                                <div className="stat-box">
                                    <div className="stat-label">Total Score</div>
                                    <div className="stat-value">{userStats.score}</div>
                                </div>
                                <div className="stat-box">
                                    <div className="stat-label">Streak 🔥</div>
                                    <div className="stat-value">{userStats.streak}</div>
                                </div>
                                <div className="stat-box">
                                    <div className="stat-label">Level ⭐</div>
                                    <div className="stat-value">{userStats.level}</div>
                                </div>
                                <div className="stat-box">
                                    <div className="stat-label">Attempts</div>
                                    <div className="stat-value">{userStats.attempts}</div>
                                </div>
                            </div>

                            <div style={{marginTop: '30px'}}>
                                <button className="btn-primary" onClick={onStartPractice} style={{maxWidth: '200px'}}>
                                    📚 Start Practice
                                </button>
                            </div>

                            <h3 style={{color: '#00d4ff', marginTop: '40px'}}>Your Study Groups</h3>
                            {groups.length === 0 ? (
                                <p style={{color: '#b0b0b0'}}>No groups yet. Create one to study with friends!</p>
                            ) : (
                                <div className="groups-grid">
                                    {groups.map(group => (
                                        <div key={group.id} className="group-card" onClick={() => onSelectGroup(group)}>
                                            <h3>👥 {group.name}</h3>
                                            <div className="group-members">Members: {group.members.length}</div>
                                            <p style={{fontSize: '12px', marginTop: '10px', color: '#00d4ff'}}>Click to view →</p>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <button className="btn-primary" onClick={onCreateGroup} style={{marginTop: '20px', maxWidth: '200px'}}>
                                ➕ Create New Group
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Group Detail Screen Component
        function GroupDetailScreen({ group, onBack, onStartPractice }) {
            const leaderboard = group.leaderboard.sort((a, b) => b.score - a.score);

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>👥 {group.name}</h1>
                        <button className="btn-secondary" onClick={onBack}>← Back</button>
                    </div>

                    <div className="content">
                        <div className="main-content">
                            <div style={{marginBottom: '30px'}}>
                                <h3 style={{color: '#00d4ff', marginBottom: '10px'}}>Invite Code: <code style={{color: '#fff', background: 'rgba(0,0,0,0.2)', padding: '5px 10px', borderRadius: '5px'}}>{group.inviteCode}</code></h3>
                                <p style={{color: '#b0b0b0', fontSize: '12px'}}>Share this code for friends to join!</p>
                            </div>

                            <h3 style={{color: '#00d4ff', marginBottom: '15px'}}>🏆 Group Leaderboard</h3>
                            <div className="leaderboard">
                                <div className="leaderboard-header">
                                    <div>Rank</div>
                                    <div>Student</div>
                                    <div>Score</div>
                                    <div>Attempts</div>
                                </div>
                                {leaderboard.map((entry, idx) => (
                                    <div key={idx} className="leaderboard-row">
                                        <div className="rank">
                                            {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}
                                        </div>
                                        <div>{entry.username}</div>
                                        <div style={{color: '#00d4ff'}}>{entry.score}</div>
                                        <div style={{color: '#b0b0b0'}}>{entry.attempts || 0}</div>
                                    </div>
                                ))}
                            </div>

                            <button className="btn-primary" onClick={onStartPractice} style={{marginTop: '30px', maxWidth: '200px'}}>
                                📚 Practice Together
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AvatarTutorApp />);
    </script>
</body>
</html>
